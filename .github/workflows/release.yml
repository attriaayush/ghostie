name: Release

on:
  release:
    types: [created]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check format
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run clippy (all features)
        run: cargo clippy --all-targets --locked --all-features -- -D warnings
      - name: Run tests
        run: cargo test
      - name: Build
        run: cargo build --release --all-features
      - name: Rename Release (Unix)
        run: |
          cargo install default-target
          mkdir assets
          FILENAME=ghostie-${{github.event.release.tag_name}}-$(default-target)
          mv target/release/ghostie assets
          cd assets
          tar --format=ustar -czf $FILENAME.tar.gz ghostie
          rm ghostie
          ls .
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
