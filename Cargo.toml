[package]
name = "ghostie"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "ghostie"
path = "src/main.rs"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
chrono = { version = "0.4", default-features = false, features = [
  "serde",
  "clock",
  "now",
] }
open = "5"
daemonize = "0.5"
sysinfo = "0.33"
dialoguer = "0.11"
reqwest = { version = "0.12", features = ["json"] }
thiserror = "2"
which = "7"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"

[dev-dependencies]
fake = "4"
rand = "0.9"
serial_test = "3"

[target.'cfg(target_os = "macos")'.dependencies]
notify-rust = "4"

[profile.release]
lto = true

[profile.dev]
opt-level = 3
